# @package _global_

# ── Hybrid RRNCO-PARCO with Real-World Distance Matrices ──────────────
# Uses OSRM distance matrices from RRNCO's city dataset.
#
# Training: generates Euclidean data on-the-fly (curriculum sampling),
#           but the model learns distance-aware representations.
# Val/Test: evaluated on real-world distance matrices from cities.
#
# To generate val/test data first, run:
#   cd hybrid
#   python scripts/generate_real_data.py \
#       --data_dir ../real-routing-nco/data/dataset \
#       --output_dir data/hcvrp_real \
#       --graph_size 100 --dataset_size 1280 --num_agents 7 \
#       --split train --seed 42 --output_name val_real_n100_m7.npz
#   python scripts/generate_real_data.py \
#       --data_dir ../real-routing-nco/data/dataset \
#       --output_dir data/hcvrp_real \
#       --graph_size 100 --dataset_size 1280 --num_agents 7 \
#       --split test --seed 42 --output_name test_real_n100_m7.npz

defaults:
  - override /model: hybrid.yaml
  - override /env: hcvrp_real.yaml
  - override /callbacks: default.yaml
  - override /trainer: default.yaml
  - override /logger: wandb.yaml

# ── Environment with real-world val/test files ──
# NOTE: data_dir (from env config) is prepended to val_file/test_file,
# so these are relative to data_dir = ${paths.root_dir}/data/hcvrp_real
env:
  data_dir: ${paths.root_dir}/data/hcvrp_real
  val_file: val_real_n100_m7.npz
  test_file: test_real_n100_m7.npz
  generator_params:
    num_loc: 100
    num_agents: 7
    compute_distance_matrix: true  # Euclidean for training

# ── Model hyperparameters ──
model:
  policy:
    _target_: "hybrid.models.policy.HybridPolicy"
    env_name: "${env.name}"
    embed_dim: 64
    num_heads: 4
    # RRNCO encoder params
    num_encoder_layers: 6
    nab_type: "gating"
    feedforward_hidden: 256
    normalization_encoder: "instance"
    # PARCO decoder params
    agent_handler: "highprob"
    use_distance_bias: true
    # Communication layer params
    context_embedding_kwargs:
      normalization: "rms"
      norm_after: false
      use_final_norm: true
      parallel_gated_kwargs:
        mlp_activation: "silu"
  batch_size: 8
  val_batch_size: ${model.batch_size}
  test_batch_size: ${model.batch_size}
  train_data_size: 100_000
  val_data_size: 10_000
  test_data_size: 10_000
  optimizer_kwargs:
    lr: 1e-4       # Reduced from 2e-4 to prevent NaN from large early gradients
    weight_decay: 1e-6
  lr_scheduler:
    "MultiStepLR"
  lr_scheduler_kwargs:
    milestones: [160, 190]
    gamma: 0.1
  lr_scheduler_interval: "epoch"
  warmup_epochs: 1   # Linear LR warmup over first epoch (handled in HybridRLModule)
  num_augment: 8
  train_min_agents: 3
  train_max_agents: ${env.generator_params.num_agents}
  train_min_size: 60
  train_max_size: ${env.generator_params.num_loc}

# ── Logging ──
logger:
  wandb:
    project: "hybrid-rrnco-parco-real"
    tags: ["hybrid", "rrnco-encoder", "parco-decoder", "real-world", "${env.name}"]
    group: "real_n${env.generator_params.num_loc}_m${env.generator_params.num_agents}"
    name: "hybrid-real-osrm"

# ── Trainer ──
trainer:
  max_epochs: 200

seed: 1234

callbacks:
  model_checkpoint:
    monitor: "val/reward"
