# @package _global_
# 4GB-friendly override of hybrid_hcvrp.yaml
# Reduces batch/augment and uses grad accumulation to keep effective batch ~8.

defaults:
  - override /model: hybrid.yaml
  - override /env: hcvrp_real.yaml
  - override /callbacks: default.yaml
  - override /trainer: default.yaml
  - override /logger: wandb.yaml

# Environment
env:
  balance_weight: 0.1

generator_params:
  num_loc: 100
  num_agents: 7

# Model hyperparameters
model:
  micro_batch_aug: 4
  policy:
    _target_: "hybrid.models.policy.HybridPolicy"
    env_name: "${env.name}"
    embed_dim: 64
    num_heads: 4
    num_encoder_layers: 6
    nab_type: "gating"
    feedforward_hidden: 256
    normalization_encoder: "instance"
    agent_handler: "highprob"
    use_distance_bias: true
    use_checkpoint: true
    context_embedding_kwargs:
      normalization: "rms"
      norm_after: false
      use_final_norm: true
      parallel_gated_kwargs:
        mlp_activation: "silu"
  batch_size: 2
  val_batch_size: ${model.batch_size}
  test_batch_size: ${model.batch_size}
  train_data_size: 100_000
  val_data_size: 10_000
  test_data_size: 10_000
  optimizer_kwargs:
    lr: 1e-4
    weight_decay: 1e-6
  lr_scheduler: "MultiStepLR"
  lr_scheduler_kwargs:
    milestones: [160, 190]
    gamma: 0.1
  lr_scheduler_interval: "epoch"
  warmup_epochs: 1
  num_augment: 4
  train_min_agents: 3
  train_max_agents: ${env.generator_params.num_agents}
  train_min_size: 60
  train_max_size: ${env.generator_params.num_loc}

# Logging
logger:
  wandb:
    project: "hybrid-rrnco-parco-${env.name}"
    tags: ["hybrid", "rrnco-encoder", "parco-decoder", "${env.name}"]
    group: "${env.name}_n${env.generator_params.num_loc}_m${env.generator_params.num_agents}"
    name: "hybrid-rrnco-parco-4gb"

# Trainer - 4GB settings
trainer:
  max_epochs: 200
  accumulate_grad_batches: 4
  precision: "16-mixed"

seed: 1234

callbacks:
  model_checkpoint:
    monitor: "val/reward"
