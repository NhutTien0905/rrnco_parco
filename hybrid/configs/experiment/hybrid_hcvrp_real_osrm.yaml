# @package _global_

defaults:
  - override /model: hybrid.yaml
  - override /env: hcvrp_real_osrm.yaml
  - override /callbacks: default.yaml
  - override /trainer: default.yaml
  - override /logger: wandb.yaml

# ── Environment ──
env:
  val_file: val_real_n100_m7.npz
  test_file: test_real_n100_m7.npz

# ── Model hyperparameters ──
model:
  policy:
    _target_: "hybrid.models.policy.HybridPolicy"
    env_name: "${env.name}"
    embed_dim: 128
    num_heads: 8
    # RRNCO encoder params
    num_encoder_layers: 6
    nab_type: "gating"
    feedforward_hidden: 256
    normalization_encoder: "instance"
    # PARCO decoder params
    agent_handler: "highprob"
    use_distance_bias: true
    # Communication layer params
    context_embedding_kwargs:
      normalization: "rms"
      norm_after: false
      use_final_norm: true
      parallel_gated_kwargs:
        mlp_activation: "silu"
  # ── Batch sizes ──────────────────────────────────────────────────────
  # Train: effective batch = batch_size × num_augment = 4 × 4 = 16
  # Val/test: NO augmentation (see rl.py), so val sees exactly val_batch_size
  batch_size: 8            # 🔥 restored — val no longer multiplied by n_aug
  val_batch_size: 1        # ✅ decoupled: small val batch to keep N×N tensors safe
  test_batch_size: 1
  train_data_size: 100_000
  val_data_size: 10_000
  test_data_size: 1_280    # match the file size (1280 instances)
  optimizer_kwargs:
    lr: 1e-4       # Reduced from 2e-4 to prevent NaN from large early gradients
    weight_decay: 1e-6
  lr_scheduler:
    "MultiStepLR"
  lr_scheduler_kwargs:
    milestones: [30, 60]   # 🔥 earlier decay to escape plateau
    gamma: 0.5             # 🔥 softer decay (was 0.1)
  lr_scheduler_interval: "epoch"
  warmup_epochs: 1   # Linear LR warmup over first epoch (handled in HybridRLModule)
  num_augment: 4           # 🔥 train-only augmentation (val is unaugmented)
  num_starts: 8            # 🔥 multiple start nodes to activate SymNCO losses (was 1)
  alpha: 0.1               # 🔥 reduced SymNCO invariance weight (was 0.2)
  beta: 0.5                # 🔥 reduced SymNCO symmetricity weight (was 1.0)
  train_min_agents: 3
  train_max_agents: 7
  train_min_size: 80       # 🔥 tighter curriculum (was 60) — less randomness
  train_max_size: 100

# ── Logging ──
logger:
  wandb:
    project: "hybrid-rrnco-parco-real"
    tags: ["hybrid", "rrnco-encoder", "parco-decoder", "real-world-train", "osrm"]
    group: "real_osrm_n100_m7"
    name: "hybrid-real-osrm-full"

# ── Trainer ──
trainer:
  max_epochs: 100
  # Accumulate 2 steps → effective train batch = 4 × 4 (aug) × 2 = 32
  # This keeps per-step GPU memory small while giving large effective batch.
  accumulate_grad_batches: 2

seed: 1234

callbacks:
  model_checkpoint:
    monitor: "val/reward"
