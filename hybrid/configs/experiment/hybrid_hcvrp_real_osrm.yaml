# @package _global_

# ── Hybrid RRNCO-PARCO: Full Real-World OSRM Training ─────────────────
# Both training and val/test use real-world OSRM distance matrices.
# Training samples on-the-fly from city data (train split, 80 cities).
# Val/Test use pre-generated NPZ files (test split, 20 cities).
#
# Prerequisites:
#   1. RRNCO city data at ../real-routing-nco/data/dataset/
#   2. Generate val/test files:
#      cd hybrid
#      python scripts/generate_real_data.py \
#          --data_dir ../real-routing-nco/data/dataset \
#          --output_dir data/hcvrp_real \
#          --graph_size 100 --dataset_size 1280 --num_agents 7 \
#          --split train --seed 42 --output_name val_real_n100_m7.npz
#      python scripts/generate_real_data.py \
#          --data_dir ../real-routing-nco/data/dataset \
#          --output_dir data/hcvrp_real \
#          --graph_size 100 --dataset_size 1280 --num_agents 7 \
#          --split test --seed 42 --output_name test_real_n100_m7.npz

defaults:
  - override /model: hybrid.yaml
  - override /env: hcvrp_real_osrm.yaml
  - override /callbacks: default.yaml
  - override /trainer: default.yaml
  - override /logger: wandb.yaml

# ── Environment ──
env:
  val_file: val_real_n100_m7.npz
  test_file: test_real_n100_m7.npz

# ── Model hyperparameters ──
model:
  policy:
    _target_: "hybrid.models.policy.HybridPolicy"
    env_name: "${env.name}"
    embed_dim: 128
    num_heads: 8
    # RRNCO encoder params
    num_encoder_layers: 6
    nab_type: "gating"
    feedforward_hidden: 512
    normalization_encoder: "instance"
    # PARCO decoder params
    agent_handler: "highprob"
    use_distance_bias: true
    # Communication layer params
    context_embedding_kwargs:
      normalization: "rms"
      norm_after: false
      use_final_norm: true
      parallel_gated_kwargs:
        mlp_activation: "silu"
  batch_size: 1
  val_batch_size: ${model.batch_size}
  test_batch_size: ${model.batch_size}
  train_data_size: 100_000
  val_data_size: 10_000
  test_data_size: 10_000
  optimizer_kwargs:
    lr: 2e-4
    weight_decay: 1e-6
  lr_scheduler:
    "MultiStepLR"
  lr_scheduler_kwargs:
    milestones: [160, 190]
    gamma: 0.1
  num_augment: 8
  train_min_agents: 3
  train_max_agents: 7
  train_min_size: 60
  train_max_size: 100

# ── Logging ──
logger:
  wandb:
    project: "hybrid-rrnco-parco-real"
    tags: ["hybrid", "rrnco-encoder", "parco-decoder", "real-world-train", "osrm"]
    group: "real_osrm_n100_m7"
    name: "hybrid-real-osrm-full"

# ── Trainer ──
trainer:
  max_epochs: 200

seed: 1234

callbacks:
  model_checkpoint:
    monitor: "val/reward"
